<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作人員後台</title>
<style>
        /* ============ 風格主題變數（與 index.html 一致） ============ */
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --border: #e2e4e9;
            --text-primary: #1f2430;
            --text-secondary: #6b7280;

            --primary: #0088A8;
            --primary-dark: #009FCC;
            --primary-light: #eff6ff;

            --success: #16a34a;
            --success-light: #ecfdf3;

            --warning: #d97706;
            --warning-light: #fffbeb;

            --danger: #dc2626;
            --danger-light: #fef2f2;

            --info: #0284c7;
            --info-light: #f0f9ff;

            --radius: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }

        input, select, textarea {
            width: 100%; padding: 11px 13px;
            border: 1px solid var(--border) !important;
            border-radius: var(--radius-sm); box-sizing: border-box;
            font-family: inherit; font-size: 15px; margin-bottom: 15px;
            color: var(--text-primary) !important;
            background-color: var(--surface) !important;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        button {
            background-color: var(--primary); color: #fff;
            border: none; padding: 11px 22px;
            border-radius: var(--radius-sm); cursor: pointer; font-weight: 600;
            transition: background 0.15s ease; font-size: 15px;
            position: relative; z-index: 100;
        }
        button:hover { background-color: var(--primary-dark); }

        #loginView {
            max-width: 380px; margin: 90px auto; text-align: center;
            background: var(--surface);
            padding: 40px 30px; border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06), 0 1px 2px rgba(16, 24, 40, 0.04);
        }
        #loginView h2 {
            margin: 0 0 8px 0;
            color: var(--text-primary);
            font-size: 21px;
        }

        #dashboardView {
            max-width: 900px; margin: 0 auto;
            background: var(--surface);
            padding: 25px; border-radius: var(--radius); min-height: 500px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06), 0 1px 2px rgba(16, 24, 40, 0.04);
            position: relative; z-index: 1;
        }

        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 22px; border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }
        .header-bar h3 { margin:0; color: var(--text-primary); font-size: 18px; }

        .logout-btn {
            background: var(--bg);
            color: var(--text-primary); font-size: 13px; padding: 8px 16px;
            border-radius: var(--radius-sm); border: 1px solid var(--border);
        }
        .logout-btn:hover { background: var(--danger-light); color: var(--danger); border-color: #f6c6c2; }

        /* 頁籤：簡約分段控制 */
        .tabs { display: flex; margin-bottom: 22px; gap: 4px; background: var(--bg); padding: 4px; border-radius: 10px; }
        .tab-btn {
            flex: 1; background: transparent; border: none;
            color: var(--text-secondary);
            padding: 10px; cursor: pointer; border-radius: 8px;
            margin: 0; font-size: 14px; font-weight: 600; transition: all 0.15s;
        }
        .tab-btn.active {
            background: var(--surface); color: var(--primary-dark);
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
        }

        /* 案件卡片 */
        .card {
            background: var(--surface); border-radius: var(--radius); padding: 22px; margin-bottom: 20px;
            border: 1px solid var(--border);
            border-left: 4px solid #ccc;
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
        }

        .status-waiting { border-left-color: var(--warning); }
        .status-processing { border-left-color: var(--info); }
        .status-done { border-left-color: var(--success); }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .meta-info { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 5px; display: block; font-family: 'SFMono-Regular', 'Courier New', monospace; }
        .card-title { font-size: 17px; font-weight: 700; color: var(--text-primary); margin: 0; }

        .status-wrapper { display: flex; gap: 8px; align-items: center; }
        .status-select {
            padding: 6px 12px; font-size: 13px; font-weight: 600;
            color: var(--text-primary) !important;
            border-radius: 20px; border: 1px solid var(--border) !important;
            cursor: pointer; width: auto !important; margin-bottom: 0;
            background: var(--surface) !important;
        }

        .save-status-btn {
            padding: 7px 14px; font-size: 13px;
            background: var(--bg); color: var(--text-primary);
            border-radius: 20px;
            margin: 0; min-width: 40px;
            position: relative; z-index: 101; border: 1px solid var(--border);
        }
        .save-status-btn:hover { background: var(--primary-light); color: var(--primary-dark); border-color: var(--primary); }

        .content-box {
            background: var(--bg);
            padding: 16px; border-radius: var(--radius-sm);
            white-space: pre-wrap; margin-bottom: 16px;
            color: var(--text-primary);
            border: 1px solid var(--border);
            line-height: 1.7;
        }

        .reply-area { border-top: 1px dashed var(--border); padding-top: 16px; margin-top: 16px; }
        .reply-area label { color: var(--text-primary); font-weight: 600; margin-bottom: 8px; display: block; }

        .reply-area textarea {
            height: 100px;
            background: var(--surface) !important;
            border: 1px solid var(--border) !important;
        }
        .reply-btn-row { text-align: right; }

        .reply-btn {
            background: var(--success);
            color: #fff;
            width: 100%; font-size: 15px; padding: 12px 24px;
            border-radius: var(--radius-sm);
        }
        .reply-btn:hover { background: #128a3e; }

        /* Loading 與彈窗 */
        #loading {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(245, 246, 248, 0.92);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; flex-direction: column; color: var(--text-primary);
        }

        #customModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(31, 36, 48, 0.35);
            display: flex; justify-content: center;
            align-items: center; z-index: 10000;
        }
        .modal-content {
            background: var(--surface); padding: 32px; border-radius: var(--radius); max-width: 90%;
            width: 380px; text-align: center;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(16, 24, 40, 0.15);
            transform: scale(0.96); opacity: 0; transition: all 0.15s ease-out;
            color: var(--text-primary);
        }
        .modal-content.show { transform: scale(1); opacity: 1; }
        .modal-message { margin-bottom: 22px; font-size: 16px; line-height: 1.5; color: var(--text-primary); }

        .modal-buttons button {
            margin: 0 8px; padding: 10px 20px; border-radius: 20px; font-weight: 600;
            width: 110px;
        }
        #modalBtnCancel { background-color: var(--bg); color: var(--text-primary); border: 1px solid var(--border); }
        #modalBtnConfirm { background-color: var(--primary); color: #fff; }

        .subject-line {
            font-size: 15px; font-weight: 700;
            color: var(--text-primary);
            margin: 10px 0; padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        #displayName {
            font-size: 13px; color: var(--text-secondary); font-weight: 400; margin-left: 8px;
        }

        textarea[id^="reply-"] {
            width: 100%; max-width: 100%; min-height: 220px;
            resize: vertical; line-height: 1.6; padding: 14px; font-size: 14.5px;
            background: var(--surface) !important;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loading" class="hidden" style="display: none;">
    <h3 style="font-size: 20px;">處理中...</h3>
</div>

<div id="customModal" class="hidden">
    <div class="modal-content" id="modalContent">
        <p class="modal-message" id="modalMessage"></p>
        <div class="modal-buttons">
            <button id="modalBtnCancel" class="hidden">取消</button>
            <button id="modalBtnConfirm">確定</button>
        </div>
    </div>
</div>

<div id="loginView">
    <h2>工作人員登入</h2>
    <p style="color:var(--text-secondary); margin-bottom:20px; font-size:14px;">田總召御用陳情系統網頁後台</p>
    <div style="text-align: left;">
        <label style="font-weight:600; display:block; margin-bottom:6px; font-size:14px;">帳號</label>
        <input type="text" id="acc" placeholder="請輸入帳號">
    </div>
    <div style="text-align: left;">
        <label style="font-weight:600; display:block; margin-bottom:6px; font-size:14px;">密碼</label>
        <input type="password" id="pwd" placeholder="請輸入密碼">
    </div>
    <button id="loginBtn" style="width:100%; margin-top:10px;">登入系統</button>
    <p id="msg" style="color: var(--danger); margin-top: 15px; font-weight: 600; font-size: 14px;"></p>
</div>

<div id="dashboardView" class="hidden">
    <div class="header-bar">
        <h3>案件管理後台<span id="displayName"></span></h3>
        <button class="logout-btn" id="logoutBtn">登出</button>
    </div>
    <div class="tabs">
        <button class="tab-btn active" id="tabBtn_待處理">待處理</button>
        <button class="tab-btn" id="tabBtn_處理中">處理中</button>
        <button class="tab-btn" id="tabBtn_處理完成">處理完成</button>
    </div>
    <div id="listArea"></div>
</div>

<script>
    // ⚠️⚠️⚠️ 請將下方的網址換成您部署後的 Web 應用程式網址 ⚠️⚠️⚠️
    const scriptURL =
        'https://script.google.com/macros/s/OOOOOOOO/exec';

    let allCases = [];
    let currentTab = '待處理';
    let confirmCallback = null;

    function hideModal() {
        document.getElementById('customModal').classList.add('hidden');
        document.getElementById('modalContent').classList.remove('show');
    }

    function showCustomAlert(message) {
        document.getElementById('modalMessage').innerText = message;
        document.getElementById('modalBtnCancel').classList.add('hidden');
        document.getElementById('modalBtnConfirm').onclick = () => {
            hideModal();
            confirmCallback = null;
        };
        document.getElementById('customModal').classList.remove('hidden');
        setTimeout(() => document.getElementById('modalContent').classList.add('show'), 10);
    }

    function showCustomConfirm(message, callback) {
        document.getElementById('modalMessage').innerText = message;
        document.getElementById('modalBtnCancel').classList.remove('hidden');
        confirmCallback = callback;
        document.getElementById('modalBtnConfirm').onclick = () => {
            if (confirmCallback) { confirmCallback(true); }
            hideModal();
            confirmCallback = null;
        };
        document.getElementById('modalBtnCancel').onclick = () => {
            hideModal();
            confirmCallback = null;
        };
        document.getElementById('customModal').classList.remove('hidden');
        setTimeout(() => document.getElementById('modalContent').classList.add('show'), 10);
    }

    window.onload = () => {
        initEventListeners();
        if (sessionStorage.getItem('isStaff') === 'true') {
            showDash();
        }
    };

    function initEventListeners() {
        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('tabBtn_待處理').addEventListener('click', () => switchTab('待處理'));
        document.getElementById('tabBtn_處理中').addEventListener('click', () => switchTab('處理中'));
        document.getElementById('tabBtn_處理完成').addEventListener('click', () => switchTab('處理完成'));
        document.addEventListener('click', handleFinalDelegation);
    }

    function handleFinalDelegation(event) {
        const target = event.target;
        if (target.id === 'logoutBtn') { logout(); return; }
        if (target.classList.contains('save-status-btn')) {
            const caseId = target.id.replace('saveBtn-', '');
            justUpdateStatus(caseId);
            return;
        }
        if (target.classList.contains('reply-btn')) {
            const caseId = target.id.replace('replyBtn-', '');
            sendReplyAndClose(caseId);
            return;
        }
    }

    function toggleLoading(show) {
        const el = document.getElementById('loading');
        if (show) {
            el.style.display = 'flex'; el.classList.remove('hidden');
        } else {
            el.style.display = 'none'; el.classList.add('hidden');
        }
    }

    function logout() {
        showCustomConfirm("確定要登出嗎？", (confirmed) => {
            if (confirmed) {
                sessionStorage.removeItem('isStaff');
                sessionStorage.removeItem('staffName');
                sessionStorage.removeItem('staffPosition');
                document.getElementById('dashboardView').style.display = 'none';
                document.getElementById('loginView').style.display = 'block';
                document.getElementById('msg').innerText = '';
            }
        });
    }

    function login() {
        let acc = document.getElementById('acc').value;
        let pwd = document.getElementById('pwd').value;
        if (!acc || !pwd) { document.getElementById('msg').innerText = "❌ 請輸入帳號與密碼"; return; }

        toggleLoading(true);
        let fd = new FormData();
        fd.append('action', 'staffLogin');
        fd.append('account', acc);
        fd.append('password', pwd);

        fetch(scriptURL, { method: 'POST', body: fd })
            .then(r => r.json())
            .then(d => {
                toggleLoading(false);
                if (d.result === 'success') {
                    sessionStorage.setItem('staffAcc', acc);
                    sessionStorage.setItem('staffPwd', pwd);
                    sessionStorage.setItem('staffName', d.name || 'N/A');
                    sessionStorage.setItem('staffPosition', d.position || 'N/A');
                    sessionStorage.setItem('isStaff', 'true');
                    document.getElementById('acc').value = ''; document.getElementById('pwd').value = '';
                    showDash();
                } else {
                    document.getElementById('msg').innerText = "❌ " + (d.error || "帳號或密碼錯誤");
                }
            })
            .catch(e => {
                toggleLoading(false);
                document.getElementById('msg').innerHTML = "❌ 連線失敗！";
            });
    }

    function showDash() {
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('dashboardView').classList.remove('hidden');
        document.getElementById('dashboardView').style.display = 'block';

        const name = sessionStorage.getItem('staffName');
        const pos = sessionStorage.getItem('staffPosition');
        document.getElementById('displayName').innerText = ` (登入者：${pos} ${name} )`;

        loadData();
    }

    function loadData() {
        toggleLoading(true);
        let fd = new FormData();
        fd.append('action', 'getStaffData');

        fd.append('account', sessionStorage.getItem('staffAcc'));
        fd.append('password', sessionStorage.getItem('staffPwd'));

        fetch(scriptURL, { method: 'POST', body: fd })
            .then(r => r.json())
            .then(d => {
                toggleLoading(false);
                if (d.result === 'success') {
                    allCases = d.cases;
                    renderList();
                } else {
                    showCustomAlert("讀取失敗，後端回傳： " + (d.error || "未知錯誤"));
                }
            })
            .catch(e => {
                toggleLoading(false);
                showCustomAlert("連線錯誤或後端程式崩潰");
            });
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.toggle('active', b.innerText === tab);
        });
        renderList();
    }

    function escapeHtml(text) {
        if (!text) return "";
        return text.toString()
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function renderList() {
        const area = document.getElementById('listArea');
        area.innerHTML = '';
        const isDoneTab = currentTab === '處理完成';
        const filtered = allCases.filter(c => {
            let s = c.status || '待處理';
            if (s === '已結案' || s === '無效案件') s = '處理完成';
            return s === currentTab;
        });

        if (filtered.length === 0) {
            area.innerHTML = `<div style="text-align:center;color:var(--text-secondary);padding:40px;border:1px dashed var(--border);border-radius:var(--radius);">目前無「${currentTab}」案件</div>`;
            return;
        }

        filtered.forEach(c => {
            let borderClass = 'status-waiting';
            if (c.status === '處理中') borderClass = 'status-processing';
            if (c.status === '處理完成' || c.status === '已結案' || c.status === '無效案件') borderClass = 'status-done';

            // --- 1. 根據身分判斷顯示資訊（已加入防注入） ---
            let infoHtml = "";
            if (c.identity === "實名") {
                infoHtml = `
                    <div style="background: var(--info-light); padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 10px; border-left: 4px solid var(--info); font-size: 14px; color: var(--text-primary);">
                        <b style="color: var(--info);">實名陳情案件</b><br>
                        姓名：${c.name ? escapeHtml(c.name) : '未提供'}<br>
                        學號：${c.studentId ? escapeHtml(c.studentId) : '未提供'}<br>
                        Mail：${escapeHtml(c.email)}
                    </div>`;
            } else {
                infoHtml = `
                    <div style="background: var(--danger-light); padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 10px; border-left: 4px solid var(--danger); font-size: 14px; color: var(--text-primary);">
                        <b style="color: var(--danger);">匿名陳情案件</b><br>
                        Mail：${escapeHtml(c.email)}
                    </div>`;
            }

            let statusControlHTML;
            if (isDoneTab) {
                let displayStatus = c.status === '已結案' ? '已結案' : (c.status === '無效案件' ? '無效案件' : '處理完成');
                statusControlHTML = `<span style="font-weight:700; color:var(--success); padding:6px 12px; border:1px solid var(--success); border-radius:20px; font-size:13px; background:var(--success-light);">${escapeHtml(displayStatus)}</span>`;
            } else {
                statusControlHTML = `
                    <select id="status-select-${c.caseId}" class="status-select">
                        <option value="待處理" ${c.status==='待處理'?'selected':''}>待處理</option>
                        <option value="處理中" ${c.status==='處理中'?'selected':''}>處理中</option>
                    </select>
                    <button class="save-status-btn" id="saveBtn-${c.caseId}" title="儲存狀態與回覆草稿">儲存</button>
                `;
            }

            let replyAreaHTML;
            const safeHandlingStaff = c.handlingStaff ? escapeHtml(c.handlingStaff) : '未記錄';

            if (isDoneTab) {
                replyAreaHTML = `
                    <div class="reply-area">
                        <label style="font-weight:600; display:block; margin-bottom:5px;">最終回覆內容：</label>
                        <textarea id="reply-${c.caseId}" readonly style="background:var(--bg) !important; color:var(--text-secondary);">${c.reply ? escapeHtml(c.reply) : '無回覆內容'}</textarea>
                        <div style="margin-top:15px; font-weight:600; color:var(--text-primary); border-top:1px solid var(--border); padding-top:10px;">
                            辦理人員：<span style="font-weight:400; color:var(--text-primary);">${safeHandlingStaff}</span>
                        </div>
                    </div>
                `;
            } else {
                const staffInfo = c.status === '處理中' ?
                `<div style="margin-bottom:15px; font-size:14px; color:var(--text-secondary);">陳辦人：${safeHandlingStaff}</div>` : '';
                replyAreaHTML = `
                    <div class="reply-area">
                        <label style="font-weight:600; display:block; margin-bottom:5px;">回覆內容：</label>
                        <textarea id="reply-${c.caseId}" placeholder="請在此輸入回覆..." onkeydown="handleReplyKey(event, '${c.caseId}')">${c.reply ? escapeHtml(c.reply) : ''}</textarea>
                        ${staffInfo}
                        <div class="reply-btn-row">
                            <button class="reply-btn" id="replyBtn-${c.caseId}">送出回覆並結案</button>
                        </div>
                    </div>
                `;
            }

            // --- 2. 組合卡片（主旨與內容皆已加入防注入） ---
            let div = document.createElement('div');
            div.className = `card ${borderClass}`;
            div.innerHTML = `
                <div class="meta-info">${escapeHtml(c.time.substring(0,16))} | ${escapeHtml(c.caseId)}</div>
                <div class="card-header">
                    <div class="card-title">【${escapeHtml(c.category)}】</div>
                    <div class="status-wrapper">${statusControlHTML}</div>
                </div>
                ${infoHtml}
                <div class="subject-line">主旨：${c.subject ? escapeHtml(c.subject) : '無主旨'}</div>
                <div class="content-box">${c.content ? escapeHtml(c.content).replace(/\n/g, '<br>') : '無內容'}</div>
                ${replyAreaHTML}
            `;
            area.appendChild(div);
        });
    }

    function handleReplyKey(event, caseId) {
        if (event.keyCode === 13 && (event.ctrlKey || event.metaKey)) {
            event.preventDefault();
            sendReplyAndClose(caseId);
        }
    }

    function justUpdateStatus(caseId) {
        let newStatus = document.getElementById(`status-select-${caseId}`).value;
        let content = document.getElementById(`reply-${caseId}`).value;

        const staffName = sessionStorage.getItem('staffName');
        toggleLoading(true);
        let fd = new FormData();
        fd.append('action', 'staffUpdateStatus');
        fd.append('caseId', caseId);
        fd.append('status', newStatus);
        fd.append('replyContent', content);
        fd.append('handlingStaff', staffName);
        fd.append('account', sessionStorage.getItem('staffAcc'));
        fd.append('password', sessionStorage.getItem('staffPwd'));
        fetch(scriptURL, { method: 'POST', body: fd })
            .then(r => r.json())
            .then(d => {
                toggleLoading(false);
                if(d.result === 'success') {
                    showCustomAlert("✅ 狀態已儲存！");
                    loadData();
                } else {
                    showCustomAlert("❌ 儲存失敗： " + d.error);
                }
            }).catch(() => {
                toggleLoading(false);
                showCustomAlert("網路連線異常");
            });
    }

    function sendReplyAndClose(caseId) {
        let content = document.getElementById(`reply-${caseId}`).value;
        if (!content) { showCustomAlert("請輸入回覆內容"); return; }
        showCustomConfirm("確定要送出回覆並「結案」嗎？", (confirmed) => {
            if (confirmed) {
                const staffName = sessionStorage.getItem('staffName');
                toggleLoading(true);
                let fd = new FormData();
                fd.append('action', 'staffReply');
                fd.append('caseId', caseId);
                fd.append('status', '處理完成');
                fd.append('replyContent', content);
                fd.append('handlingStaff', staffName);
                fd.append('account', sessionStorage.getItem('staffAcc'));
                fd.append('password', sessionStorage.getItem('staffPwd'));
                fetch(scriptURL, { method: 'POST', body: fd })
                .then(r => r.json())
                .then(d => {
                    toggleLoading(false);
                    if(d.result === 'success') {
                        showCustomAlert("✅ 已送出回覆並結案！");
                        loadData();
                    } else {
                        showCustomAlert("❌ 操作失敗：" + d.error);
                    }
                }).catch(error => {
                    toggleLoading(false);
                    console.error(error);
                    showCustomAlert("❌ 連線錯誤或後端程式崩潰，請檢查網路或 Excel 權限。");
                });
            }
        });
    }
</script>
</body>
</html>
